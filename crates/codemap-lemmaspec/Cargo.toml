[package]
name = "codemap-lemmaspec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
publish.workspace = true
description = "Projects a codemap snapshot into LemmaSpec evidence for the checkers it ships"

[lib]
name = "codemap_lemmaspec"
path = "src/lib.rs"

[dependencies]
codemap-graph = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
lemmaspec = { path = "../lemmaspec" }
tempfile = "3"

[lints]
workspace = true
